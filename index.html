<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PawPoint 🐾</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- Decorative bg paws -->
    <div class="bg-paws" aria-hidden="true">
      <span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span>
    </div>

    <header>
      <div class="logo">🐾 PawPoint</div>
      <div class="header-right">
        <div class="paw-points-pill">⭐ <span id="headerPawPoints">10</span> pts</div>
        <button class="cart-btn" onclick="openCart()">
          🛒
          <span class="cart-badge" id="cartCount">0</span>
        </button>
      </div>
    </header>

    <main id="screen"></main>

    <nav>
      <button onclick="setActiveNav(this); showHome()" class="nav-btn active-nav">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Home</span>
      </button>
      <button onclick="setActiveNav(this); showFeeders()" class="nav-btn">
        <span class="nav-icon">📍</span>
        <span class="nav-label">Feeders</span>
      </button>
      <button onclick="setActiveNav(this); showShop()" class="nav-btn">
        <span class="nav-icon">🛍</span>
        <span class="nav-label">Shop</span>
      </button>
      <button onclick="setActiveNav(this); showQuest()" class="nav-btn">
        <span class="nav-icon">🧩</span>
        <span class="nav-label">PawQuest</span>
      </button>
      <button onclick="setActiveNav(this); showCommunity()" class="nav-btn">
        <span class="nav-icon">💬</span>
        <span class="nav-label">Community</span>
      </button>
    </nav>
  </div>

  <!-- Cart Modal -->
  <div id="cartModal" class="modal hidden" onclick="handleModalBackdrop(event)">
    <div class="modal-box">
      <div class="modal-header">
        <h2>🛒 Your Cart</h2>
        <button class="close-x" onclick="closeCart()">✕</button>
      </div>
      <div id="cartItems" class="cart-items-list"></div>
      <div class="cart-total-row">
        <span>Total</span>
        <span class="cart-total-amount">QAR <span id="cartTotal">0</span></span>
      </div>
      <button class="btn-primary full-width" onclick="checkout()">✨ Checkout with Snoonu</button>
      <button class="btn-ghost full-width" onclick="closeCart()">Continue Shopping</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="script.js"></script>
</body>
</html>
